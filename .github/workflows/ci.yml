name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史（默认 fetch-depth: 1 是浅克隆）：
          # scripts/check-references.cjs 用 `git log --diff-filter=D --name-only` 取历史删除清单来
          # 检测「指向已删除文件的引用」；浅克隆拿不到删除历史，那项检查会形同虚设（脚本只能发
          # shallow-clone 警告）。fetch-depth: 0 才能让该门禁在 CI 里完整生效。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine + JSON contracts + graph + managed MCP)
        run: npm test
      - name: Library + MCP tool contract
        run: node ci-contract-check.cjs
      - name: Reference integrity guard
        # 引用完整性门禁（scripts/check-references.cjs v1.3.0）9 类检查，编号与脚本 `--help` 一致
        # （`--help` 的编号列表 = 人类报告的分组顺序 = `--json` 的 summary.checks 顺序，三者同源于脚本
        # 内 CHECK_TITLES，自 v1.3.0 起不再有两份顺序）：
        # ① 悬空路径引用（dangling-reference）— Markdown 相对链接/图片；package.json 的
        #    main/types/exports/bin/files 字段；package.json 各 script 与 CI run: 里的 `node <路径>`
        #    与 `npm run <script>` 目标；大小写不一致同按 error（Windows 能过、Linux CI 会挂）。
        # ② 相对说明符指向不存在的文件（dangling-module-specifier）— 相对 import/export … from /
        #    import(…) / require(…) 的说明符指向「磁盘上根本不存在」的文件即 error；优先用仓库自带
        #    typescript 的编译器 API 解析语法树，拿不到 typescript 时降级为正则并在报告里标注。
        #    与第 3 项互斥：「根本不存在」归本项，「存在但不在索引」归第 3 项，不重复报。
        # ③ 未纳入 git 索引的引用目标（untracked-reference）— 目标是否合法以 git 索引
        #    `git ls-files` 为权威，而不是磁盘存在性：已跟踪文件引用了「磁盘上有、索引里没有、
        #    又不被忽略规则覆盖」的路径即 error，本该 git add。覆盖相对 import/export 说明符、
        #    package.json 的 main/types/module/browser/bin/exports/files 与 script、CI run: 里的
        #    `node <路径>`、Markdown 仓库内相对链接（被忽略规则覆盖的目标跳过并计数）。
        # ④ 指向已删除文件的引用（deleted-reference）— 靠 `git log --diff-filter=D --name-only` 取
        #    历史删除清单，依赖上面 checkout 的 fetch-depth: 0；历史文体（CHANGELOG.md）走脚本内豁免。
        # ⑤ 版本字面量漂移（version-drift）— 两族：跟 package.json 走的 VERSION_SYNC_LITERALS（快照见下）；跟「被引用脚本自身 TOOL_VERSION」走的 SCRIPT_VERSION_CITATIONS（即本文件步骤注释里那 4 处 `scripts/*.cjs v1.2.3`，比较基准不是包版本）。
        # ⑥ 本地安装包文件名漂移（tarball-version-drift）— 文档里的 `…-<版本>.tgz` 必须等于本次
        #    `npm pack` 的产物名；CHANGELOG.md 与 docs/RELEASE-*.md 属历史文体，不做断言。
        # ⑦ 测试脚本清单一致性（test-inventory）— script 里的 `node tests/xxx.mjs` 必须真实存在。
        # ⑧ 锚点未命中真实标题（dead-anchor）— 相对链接的 #fragment 必须命中目标 Markdown 的真实标题。
        # ⑨ 门禁自身不可用（guard-unavailable）— 读不到就必须红：在 git 索引里的文本文件读失败
        #    （EISDIR 被同名目录顶替 / EPERM·EACCES ACL 拒绝 / ENOENT 索引里有磁盘上没有）即 error，
        #    编码不可信（UTF-16 BOM、高比例 NUL、非法 UTF-8）同样 error，绝不按 utf8 静默硬解码；
        #    拿不到 git 跟踪清单或历史删除清单也是 error（浅克隆除外，那种情况为 warning）。
        # 快照（2026-10-05，【只作留痕，不是现值】）：以上「9 类」以当时 scripts/check-references.cjs 的
        # CHECK_TITLES（9 项）与当时的 VERSION_SYNC_LITERALS（8 条：src/adapters/mcp.ts、package-lock.json ×2、
        # tests/mcp-e2e.mjs、README.md、README_EN.md、docs/SPEC.zh-CN.md 为 error，lib/adapters/mcp.js
        # 编译产物为 warning）为准。**两个条数都是活值 —— 取数、不复述**：
        #   · 「9 类」（= CHECK_TITLES 顶层项数）：node scripts/check-references.cjs --json → summary.checks.length
        #   · VERSION_SYNC_LITERALS 条数：数脚本里该数组的 id: 行数（error / warning 按同段 severity: 拆）
        # 后者的完整取数命令与实跑输出见 CONTRIBUTING.md「引用完整性门禁」第 5 项末尾那段代码块（本批实跑 = 8 条：
        # 7 error + 1 warning，与上面那行 2026-10-05 的留痕值相同）。
        # 该脚本仍在扩充，**新增检查项或同步字面量时必须同步改本注释与 CONTRIBUTING.md**。
        # 已列进 `npm run check`（在 ci-contract-check.cjs 之后），这里保留独立步骤是为了在 CI 日志里
        # 一眼看出是哪道门禁红。
        run: npm run check:refs
      - name: Doc snippet compile + consistency guard
        # 文档示例编译 / 一致性门禁（scripts/check-doc-snippets.cjs v1.0.0；**「4 项检查」是契约常量**
        # —— `CHECK_TITLES` 的顶层条目数，与链上另外两道同族；**现值取数** = `node scripts/check-doc-snippets.cjs --json`
        # 的 `summary.checks.length`，口径 = 该数组长度，**本批实测 4**；这一处的检查项数**没有**
        # `SCRIPT_VERSION_CITATIONS` 断言，只能靠这条取数命令，故写作时不要换成汉字「四项」）：把 README /
        # README_EN / docs/** / skills/**（含 docs/RELEASE-*.md）里声称可直接使用的 ```ts 用法示例
        # 还原成 .ts，用仓库自带 typescript 以 --noEmit --strict 编译（paths 映射到 lib/types/*.d.ts）；
        # 并核对文档里的工具数量断言、createPromptManagerTools 必填选项与 execute 签名描述。
        # **warning 升 error 后的新语义**：js/cjs/mjs 等「代码语言」块里出现包 import/require 却
        # 未被编译（uncompiled-package-example）直接红（历史上把语言标记写成 js 就能绕过编译），
        # 且运行时工具数量取不到（lib/ 未 build、入口不导出工厂、调用失败）同样是 error 而不是
        # warning——本步骤因此依赖前面的 Build 步骤提供 lib/ 与运行时数量，缺了是红，不是黄。
        # 也正因如此，取数失败绝不静默降级：宁可红也不要假绿；本脚本同样已列进 `npm run check`。
        # 路径引用类检查（含未跟踪引用 / 悬空引用 / 相对说明符）由上一道 Reference integrity guard
        # 负责，本脚本不重复它的职责：只读文档，全部中间产物写进 os.tmpdir()。
        run: npm run check:docs
      - name: Compiled lib/ sync guard (git index vs fresh compile)
        # 构建产物同步门禁（scripts/check-lib-sync.cjs）：把 **git 索引里的 lib/**（`git ls-files -s`
        # 给出的条目与 blob，内容用 `git cat-file --batch` 读）与「用索引版 src/ 在 os.tmpdir() 临时
        # 工程里全新编译」的产物**逐字节**比对，零归一化（不做 CRLF/BOM/尾随空白/sourcemap sources
        # 归一，比不出差异才算过）。判定基准刻意取 git 索引而不是工作区：本 workflow 上面已经跑过
        # `npm run build`，若比工作区就永远绿，恰好放过它唯一要抓的那种提交——「src/ 改了、lib/ 没
        # 重建就提交」（索引里的 lib/ 才是用户 clone/装包拿到的那份）。
        # 运行期被检查仓库只读（不写 lib/、临时工程在 finally 清理），代价是一次全量 tsc 编译。
        run: npm run check:libsync
      - name: Examples runnable + self-cleaning guard
        # 示例可执行 + 自净性门禁（scripts/check-examples.cjs）：逐条执行写死在 INCLUDE 清单里的示例
        # （**条数是活值 —— 取数、不复述**：现值 = 该脚本 `const INCLUDE = [` 与其后第一个 `\n];` 之间的
        # `path:` 行数，等价取数 = `node scripts/check-examples.cjs` 末段 `统计:` 行的「纳入 N 条」或
        # `--json` 的 `manifest.include.length`；**留痕（时点 = 本批开工版 `4e0170f`；只作留痕、不是现值）**：
        # 该时点实测 3 条 = examples/branch-development/example.mjs、examples/bilibili-trial/
        # project-data-view.mjs 的 --check 与默认影子模式），要求退出 0；并在每条示例运行前后各取一次
        # git 快照（`git status --porcelain -z`，含 --ignored 条目）求差，任何新增/修改/删除——**包括
        # 被忽略路径的变化**——都算 error（example-mutated-repo）。拦的是两类历史事故：「文档/示例
        # 声称能用、实际早崩」（CI 从不执行示例）与「跑个示例顺手改坏工作区」。
        # 依赖上面 Build 步骤的 lib/ 产物，故排在这里；耗时随机器负载变化，不在此复述
        # （取数：node scripts/check-examples.cjs 的 "示例总耗时" 行；历史观测 ~20–32 s），
        # 单列一步是为了红了能一眼看出是「示例」还是「单测」。
        run: npm run check:examples
      - name: File ledger generator check (ratchet — no auto-add, no rot)
        # 生成器 --check（scripts/generate-file-ledger.cjs v1.3.0，只比较不写盘）：台账必须与「重新生成的结果」
        # 逐字节一致，否则 exit 1。它把「台账还是不是机器可算出来的那一份」变成链上的硬失败，拦四类：
        #   ① 索引清单变了（新增/删除/改名）而台账没重跑 → tracked_total / universe_hash 漂移；
        #   ② accounted 清单腐烂没清（条目已 owned / 已命中豁免 / 已从索引消失）→ 门禁只给 warning，本步直接红；
        #   ③ **索引版 accounted 相对 HEAD 版有新增**（手工洗白）→ 逐条点名新增路径后 exit 1；
        #   ④ accounted 条目缺 accounted_at / basis，或豁免清单有语法问题（缺 reason / 未知行尾字段）→ exit 1。
        # 比较基准 = **git 索引 blob**（`git show :ledger/file-ledger.json`，与 guard 同基准），索引里没有该
        # 台账时才退回工作区文件。改基准的理由（2026-10-05 实测）：比工作区时，「把条目加进**索引版**台账 +
        # git add 而工作区不动」会让本步报绿 —— 旧实现的真实缺口；现在比索引后直接红。判据是**集合包含**
        # 而不是条数：手工 +1 与合法 -1 同时发生、条数不变时照样红。棘轮基线 = **HEAD 版台账**（提交后不可被
        # 工作区改动影响），写入侧同样如此：输出恒为「基线清单 ∩ 索引版清单 ∩ 当前条件」，手工条目在第一次
        # 重算就被剔除并点名（否则「写盘 → git add」会把洗白固化）。**首次引入**（HEAD 里没有该台账 / 仓库
        # 尚无提交）按一次性初始化处理：基线退回索引→工作区，本步 exit 0 并回显「基线由本次提交建立」；
        # HEAD 里有该文件却读不出 / 结构非法 / **schema_version 不匹配** → exit 1（fail-closed，写坏或只升一半
        # 版本的基线不能变成洗白路径——版本不匹配直接红是有意的：台账数据 / 门禁 / 生成器 / 豁免清单同一次提交一起改）。
        # 豁免清单（ledger/exempt.gitignore）是**只读输入**（本脚本不写它），按**索引版**读取（与 guard 同基准）。
        # 它**不是**棘轮的牙齿本身：新增的无条目文件不会被生成器写进 accounted（只减不增），
        # 所以「跑一次 ledger:gen 就把 unowned 洗白」不成立。
        # 与 File ledger guard 的分工：本步查「台账还是不是机器可算出来的那一份」（guard 的 accounted-growth 对
        # 「相对 HEAD 的新增」口径一致），guard 查「四态归属是否成立」。
        run: npm run check:ledger:gen
      - name: File ledger guard (four-state ownership ratchet)
        # 全仓文件台账门禁（scripts/check-file-ledger.cjs v1.3.0 + 共享内核 scripts/file-ledger-core.cjs，13 项检查）：
        # 把「这个文件有没有人管」变成可断言的机器事实。数据 = ledger/file-ledger.json（accounted 清单 + 元信息）
        # 与 ledger/exempt.gitignore（独立豁免清单：gitignore 语法 + 每条必填 reason）。
        # 绿灯依据只有一条：**台账里有条目**（owned / exempt / accounted 三条来路）——「在 HEAD 里 / 已在 git
        # 索引里」不是绿灯理由（文件旧 ≠ 已记账）；**已跟踪但无条目 → error**（包括刚提交的文件）。
        # 四态归属（计数之和必须等于 `git ls-files` 条数，逐条对账；等式本身是门禁的内部不变量断言，破了即 error）：
        #   ① owned        被模块 source.path 精确声明，且目标是真实存在的**已跟踪普通文件**（目录不算文件）；
        #   ② exempt       命中 ledger/exempt.gitignore 的某条模式（每条必带 reason；缺 reason 是 error）；
        #   ③ accounted    ledger/file-ledger.json 的 accounted 清单（每条 { path, accounted_at, basis }）——
        #                   缺 accounted_at / basis → accounted-invalid（error，没有依据的条目不是记账）；清单
        #                   **只减不增**：已 owned / 已豁免 / 已从索引消失 / 重复的条目报 warning（accounted-removable），
        #                   相对 HEAD 的任何新增报 error（accounted-growth，逐条点名）；
        #   ④ unowned      三类之外 → **error**（已跟踪但无条目，必须归属或显式豁免；**不允许**往 accounted 里加）。
        # 「只减不增」的判据（accounted-growth，error）= 与 **HEAD 版台账**比集合包含：
        #   `git show HEAD:ledger/file-ledger.json` 的 accounted 路径集合 ⊇ 本次索引版台账的路径集合。
        #   任何新增 → error（逐条列出新增路径，并给合法修法指引）；允许集合缩小。基线必须是 HEAD：旧版
        #   keep-only 比的是**同一份被改过的台账**，于是「手工把一条已在索引里的路径写进清单再 git add」能蒙过
        #   门禁与 --check（实测后门，台账进 HEAD 后已堵）。判据看**集合**不看条数：手工 +1 与合法 -1 同时发生时
        #   条数不变照样红（实测）。三态：HEAD 里有台账且 schema_version 匹配 → 正常比对；**HEAD 里没有该文件
        #   （首次引入）/ 仓库尚无提交 → 本项跳过、退出码 0**（一次性初始化：基线由本次提交建立）；HEAD 里有
        #   却读不出 / 不是合法 JSON / schema_version 不匹配 / 缺 accounted 数组 → error（fail-closed）。
        # planned 与 owned 严格分离（否则覆盖率假绿）：声明存在 ≠ 已拥有。声明条数不在此复述
        # （取数：node scripts/check-file-ledger.cjs --json 读 declaredRefs）；当前仓库的声明全部指向
        # **不存在的目标路径**（计划态），所以 owned = 0、覆盖率必须报 0.00%；报告把 planned / owned /
        # existing-file / existing-dir / declared-untracked 分开回显，绝不合并成一个「覆盖率」。
        # 判定基准是 **git 索引**（`git ls-files`）而不是工作区磁盘列举；被忽略文件不在台账宇宙内，理由写在
        # 台账 meta.known_divergences 里。台账**与豁免清单**的内容同样取索引 blob（`git show :<rel>`）：
        # 工作区与索引不一致、或其中任何一份不在索引里（没 git add）→ ledger-index-drift（error）。
        # --root 非仓库根一律 error（fail-closed，不回退到别的仓库）。
        # 豁免「过宽」判据（exempt-too-broad，error）：一条 `**` 式的模式会让整个宇宙变成 exempt 而门禁仍然报绿
        # （实测假绿），故 ① 归一化后无字面量字符（`**` / `*` / `**` 后接 `/*`）② 通配占比 > 50% 一律拒
        # （不可豁免）；③ 单条命中率 > 50% 宇宙需要条目上显式写 broad_confirmed=true 人工确认。
        # 豁免语义与标准 glob 的差异：`**` 至少匹配一层，`**` 后接 `/*.md` **不**匹配根级 c.md。
        # 豁免 × 真 .gitignore 交叉校验（exempt-gitignore-cross-check，error）：`git check-ignore --no-index`
        # 求「豁免命中 ∩ .gitignore 覆盖」（尊重 `!` 反选）、只靠 `core.ignoreCase` 折叠才命中的路径、以及
        # 「未被忽略也不在索引里」却被豁免放行的普通文件——本会话真实事故（*review*.md 在 core.ignoreCase=true
        # 下命中 preview.md）就是第一类与第二类，回归用例见 tests/file-ledger-ratchet-e2e.mjs 第 6 组。
        # 另含：台账元信息与索引不一致（universe_hash / tracked_total 漂移）→ error；台账缺失/不可解析/结构非法
        # → ledger-missing（error）；git / yaml / 模块文件 / `git check-ignore` 输出不可用 → guard-unavailable（error）。
        # 红了先看是不是「仓库里新加了文件但没条目」「台账已过期」「台账或豁免清单改了没 git add」「台账相对 HEAD
        # 多记了条目」「accounted 缺依据」或「豁免模式与 .gitignore 打架」，前者只能加归属或加带 reason 的豁免，
        # 后几者重跑 `npm run ledger:gen` 后 `git add`（生成器只减不增，**绝不**新增豁免与 accounted 条目）。
        # 回归用例：`npm test` 里的 tests/file-ledger-ratchet-e2e.mjs（**断言条数不在此写死**——活值，
        # 跑 `npm test` 看该套件末行的 `✔ N/N 条断言通过`；**留痕：本行原写「62 条断言」，独立复核者
        # 第四轮实测 84，本批实测同为 84/84**，只作留痕、不是现值；临时夹具物化、跑完自删；
        # 覆盖干净态与幂等 / schema_version 不匹配直接 error / accounted 缺 basis / 无条目新文件 /
        # `**` 过宽豁免 / 豁免条目缺 reason / 手工洗白与集合差异 / *review*.md 折叠误伤与交集 /
        # 合法缩小 / 首次引入）。
        # **规模快照块已整块换成「取数命令 + 口径」**（与下面 graph 步骤同一处置；不再复述任何规模数字，
        # 因为它们随每次提交变化，本注释历史上就因此错过多次）。要现值，跑：
        #   node scripts/check-file-ledger.cjs            四态归属 / 台账宇宙 / accounted 棘轮 / 交叉校验三类
        #   node scripts/check-file-ledger.cjs --json     summary.trackedTotal · summary.states · summary.statesSum
        #                                                 · summary.accounted.total · summary.exempt.total
        #                                                 · summary.exempt.hitFiles · summary.moduleCoverage
        # 口径：台账宇宙 = `git ls-files` 的全部已跟踪文件；四态计数之和必须等于它（门禁内部不变量断言）；
        # 豁免模式条数取 `summary.exempt.total`（**不是** `hitFiles`——那是全部模式加总的命中文件数）。
        # 历史快照（【只作留痕，不是现值】）：2026-10-05 时点 = 台账宇宙 1412（= owned 0 + exempt 1383
        # + accounted 29 + unowned 0）· 豁免清单 19 条（其中 examples/** 命中 89.2%，带 broad_confirmed
        # 人工确认）· accounted 29 条 · 归属覆盖率 0.00%（owned 0）· 交叉校验三类均为 0。
        # 该脚本仍在扩充，**新增检查项或改动豁免模式/元信息口径时必须同步改本注释与 CONTRIBUTING.md**
        # （数量、编号、覆盖范围三处）。
        run: npm run check:ledger
      - name: Reference graph generator check (file-level graph, idempotent)
        # 文件级引用图生成器 --check（scripts/generate-reference-graph.cjs v1.1.0 + 共享解析内核
        # scripts/reference-graph-core.cjs，只比较不写盘）：产物 ledger/references.json（schema_version 2）
        # 必须与「重新生成的结果」逐字节一致，否则 exit 1。它把「图还是不是当前索引算出来的那一份」
        # 变成链上的硬失败——索引清单变了（新增/删除/改名）而图没重跑，本步直接红。
        # 比较基准 = **git 索引 blob**（`git show :ledger/references.json`）。三条红线：
        #   ① 索引 blob 与重算结果不一致；② graph-index-drift：索引里的图与工作区里的图不是同一份事实
        #   （type ∈ graph-worktree-unparsable | graph-worktree-missing | graph-worktree-vs-index，全部 error）；
        #   ③ 索引里没有图文件、判定退回工作区副本 → 降级状态 = unknown 且**不判绿**（两边都没有 → graph-missing）。
        # 降级词汇与设计稿 §5.5 / §4.6 同词同义（complete / partial / unknown / stale）；本生成器只用
        # complete 与 unknown（图的观测点就是「当前索引」，没有历史维度）。
        # 判定 / 读取基准同样是 **git 索引**：内容与字节数取自 `git ls-files -s` + `git cat-file --batch[-check]`，
        # 位置 = 索引 blob 的 LF 归一化文本上的 1 基行列，排序一律 UTF-8 字节序（不用 localeCompare）。
        # 产物刻意**不写生成时刻**、不写绝对路径（图是纯机器产物，没有可写的人字段）：同一份索引连跑两次
        # 逐字节相同，这正是本 step 的判据。
        # 解析器与 Reference integrity guard **共用同一份实现**（scripts/reference-graph-core.cjs，从
        # check-references.cjs 逐字抽取，抽取前后 `--json` 的 stdout 逐字节相同）——因此不会出现
        # 「门禁说悬空、图说没事」的双真相。
        # 覆盖的边 kind：import / export-from / require / dynamic-import / markdown-link / package-field /
        # ci-target / anchor；节点四态 indexed / ignored / untracked / deleted。
        # **符号级层（增量 3，schema_version 2 新增）**：`declarations`（声明节点表）+ `symbol_edges`
        # （import / export-from / type-reference，`ts.createProgram` + `getTypeChecker`）。三条不变量在这里
        # 是**抛错级**（违反 ⇒ 生成失败、不写盘）：① 每条 `to.sym` 要么命中声明表、要么带非空 `reason`
        # （**无静默 null**）；② `declarations` / `symbol_edges` 按 UTF-8 字节序排序（不用 localeCompare）；
        # ③ Program 里只有扫描面内的 `.ts`（本仓 `src/**/*.ts`）——`node_modules` / `examples/` / `lib/` 一律不进。
        # 本批只做前四项（增量 1–4）；传递闭包 / 查询接口（增量 5）与变更影响门禁（增量 6）
        # 已在后续批次落地——查询接口见 scripts/refs-query.cjs，变更影响门禁见本文件
        # 下方“变更影响门禁”一节（即 check 链第 13 环 scripts/check-impact.cjs）。也**没有**新增「图与真实不一致就红」的
        # **语义**判定（属增量 6）——但上面②③两条**基准对称**的判定已在增量 2 落地（新增诊断码或降级词时
        # 必须同步改本注释与 CONTRIBUTING.md）。
        # 规模与构成：【不在此复述活值】——节点 / 边 / 声明 / 符号边 / 扫描面 / 产物大小都随每次重算变化，
        # 写死必然过期（本注释历史上就因此错过三次）。要现值，跑取数命令：
        #   node scripts/generate-reference-graph.cjs --check          规模与一致性（节点 / 边 / 扫描面 / 声明 / 符号边）
        #   node scripts/generate-reference-graph.cjs --check --json   机器可读：各类 kind 直方图 / degradation / timings
        #   git cat-file -s :ledger/references.json                    产物字节数（以【索引】为准）
        # 口径：节点 = `git ls-files` 的全部已跟踪文件；边 = 文件级 8 种 kind
        # （import / export-from / require / dynamic-import / markdown-link / package-field / ci-target / anchor）；
        # 声明与符号边 = 符号级层（schema_version 2）；扫描面排除 examples/ 与 lib/。
        # 历史快照（【只作留痕，不是现值】）：1,412 / 482 / 76 → 1,414 / 491 / 78 → 1,415 / 498 / 79 → 1,416 / 498 / 80。
        # 该脚本仍在扩充，**新增边 kind / 改扫描面或字段时必须同步改本注释与 CONTRIBUTING.md**。
        # 回归用例：`npm test` 里的 tests/reference-graph-e2e.mjs。
        run: npm run check:graph
      - name: Change log guard (records = two graph snapshots' diff, recomputed)
        # 改动记录门禁（scripts/generate-change-log.cjs v1.0.0 --check，只校验不写盘）：ledger/change-log/*.json
        # 里每一条记录都必须（1）符合 ledger/change-log/schema.json（draft 2020-12，ajv 校验），
        # （2）能被**重算复核**——用记录里的那对基准（提交树是内容寻址的，不可变）重建两份引用图快照、
        # 重算差，与落盘记录**逐字段**比对，不一致就 exit 1 并点名到字段。
        # created_at（记录写入时刻）与 handling（人工/追加式处理状态）是**人类字段**，不参与复核。
        # 判定 / 读取基准同样是 **git 索引与提交树**：提交侧快照用「临时索引（GIT_INDEX_FILE + git read-tree）+
        # 空工作树（GIT_WORK_TREE）」物化，历史删除清单钉到该提交（`git log --diff-filter=D … <rev>`）——
        # 因此「某个提交当时的图」与今天的历史无关、可逐字节复核；运行期不碰工作区、不向对象库写东西。
        # 降级契约（**不得把「不知道」读成「没有引用」**）：degradation.status ∈ complete / partial / unknown / stale；
        # files / edges 的数组为空**只在 complete 时才等于「没有差异」**；`unknown`（基准不可用 / 结构不合规 /
        # 重算不一致）与 `stale`（记录描述的暂存态已被后续 git add / 提交改掉）**都不判绿**，本步直接红。
        # **本批不做**（设计稿 §10 分期，产物里 omitted 字段自证）：符号级声明差与 type-reference 边（增量 3）、
        # 传递闭包与查询接口（增量 5）、cas-write 观测点（schema 用 cas_digest: const null 钉死，不假装支持）。
        # 「每次保存」不在观测点范围内（要常驻文件监听）——观测点 = 每次提交，这条边界是用户拍板确认的。
        # 改动记录：条数【不在此复述】（当时快照：2026-10-05 时点为 2 条）；
        # 现值取数：Get-ChildItem ledger/change-log/*.json | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json } | Where-Object { $_.kind -eq 'commit' } | Measure-Object | Select-Object -ExpandProperty Count
        # 其中 ed404e5（一次**真实的删除提交**：删掉一个仍被 README 链接的文件）
        # 给出 1 条 dangling-target / needs_change=true——这正是「删了某个东西之后谁还在引用它」的机器答案；
        # 另一条 10766d1（台账语义校准 v1→v2）给出文件 +2、边 +24/−20、受影响引用方 44 条。
        # **新增字段 / 改降级判据 / 改记录目录时必须同步改本注释与 CONTRIBUTING.md**。
        # 回归用例：`npm test` 里的 tests/change-log-e2e.mjs。
        run: npm run check:changes
      - name: Change impact guard (ratchet: only newly introduced dangling / unresolved)
        # 变更影响门禁（scripts/check-impact.cjs v1.0.0，`check` 链第 13 环，链上紧随 check:changes 之后）：
        # 判定本次改动是否**新引入**了断掉的引用。口径以 `node scripts/check-impact.cjs --help` 自述为准。
        # **判据**（棘轮：只拦本次改动**新引入**的，按**边的内容键**做差，不是比条数）：
        #   新增悬空   = { 当前 status === 'dangling' 的边 } − { 基线中同为 dangling 的边 }   ← 文件被删 / 改名
        #   新增未解析 = { 当前 to.sym === null 的符号级边 } − { 基线中同样未解析的符号级边 }   ← 符号被删（文件还在）
        # **边的身份 = 内容键**（= 「这处引用是什么」）：from.file + kind + specifier + field + fragment，
        # **不含行号 / 列号、也不含包含它的那个声明**。同一内容键内先按 `id` 精确配对，再按「当前独有 −
        # 基线独有」的**条数差**判新增 ⇒ ① 插几行导致的**行号平移不算新增**；② 声明**改名**也不算新增；
        # ③ 真新引入一处（同键条数 +1）照报。内容键同样 **不含解析结果**，所以基线取的是「基线中**同样命中**」
        # 的边（同为 dangling / 同为未解析），不是基线全量边——否则 resolved→dangling 的同键边会被当成
        # 「基线里已存在」而漏报。任一非空 ⇒ exit 1 并逐条点名（边 id + from 的行:列 + kind + 目标）。
        # **旧口径留痕**：v1.0.0 曾直接用边 `id`（形如 README.md:309:110:markdown-link:./docs/SPEC.zh-CN.md，
        # **行号在 `id` 里**）当身份 ⇒ 同一个引用只要行号平移就被算成「另一条边」；实测 `src/service.ts`
        # 「顶部插 3 行 + 函数体内插 3 行」把 7 条未解析边整体平移，被整片误报成新增。去掉位置与声明名即那次修订。
        # **已知边界**：同一内容键内**同时**「修好一处 + 坏掉另一处」净差为 0，会被算成没新增；同键多出 N 条时
        # 点名只保证**条数正确**（给出同键内按行列序靠后的 N 条）——未解析边不记录被引用的名字，只能到这里。
        # 「未解析」用**图自己的词表**，不另造：`to.sym === null` 的符号级边，**但排除** status === 'external' /
        # to.state === 'outside'——仓库外的裸模块说明符（node:fs、ajv…）与库类型（Program 刻意 noLib + types:[]）
        # 本来就「仓库外、无仓库内符号」，属**已按设计处置**，算进来会让门禁在健康仓库上恒红；**保留**
        # status === 'unresolved'（symbol-not-found-in-program / declaration-out-of-scope）——这才是该报的。
        # 「悬空」同样只认文件级边的 status === 'dangling'（目标文件不在索引里）。
        # **两种基准**（输出里的 basis 字段写明本次比的是哪一对）：
        #   默认（无开关）basis = "HEAD^..HEAD"  基线 = `git show HEAD^:ledger/references.json`，当前 = HEAD 版（CI / 提交后）
        #   `--staged`    basis = "HEAD..index"  基线 = HEAD 版，当前 = 索引 blob（提交前本地自查）
        # **为什么不比 HEAD vs 索引**：新克隆或 CI 检出后索引 == HEAD，那样比会**恒绿**，恰好放过它唯一要抓的
        # 那种提交；而 HEAD^ 与 HEAD 分属前后两次提交，本次引入的悬空 / 未解析出现在 HEAD 而不在 HEAD^ ⇒ 构成「新增」。
        # **棘轮**：只拦**新增**，**不追溯历史存量**——更早提交引入的悬空在 HEAD^ 与 HEAD 里都存在，不构成新增，不报。
        # **v1 没有豁免机制**（有意）：本仓「残留零容忍」——正确做法永远是**改掉引用**（删掉引用、或补回目标），
        # 不是给门禁开白名单；因此没有 `--allow-*` / 基线冻结 / 注释抑制之类机制。历史存量由上面的棘轮自动放过。
        # **前提（本步不重复那个职责）**：图必须**新鲜且完整**——这件事由链上**先于本步**的 `check:graph` 判定
        # （索引 blob 与重算结果是否一致、索引-工作区是否漂移、降级状态是否 unknown）。本步假定手上这份图是新鲜的，
        # 只做「新增破坏」的棘轮判定；图陈旧或降级导致的问题由 check:graph 报，**不在这里兜底**（图产物里没有
        # degradation 字段，本步不读它，也不去找它）。
        # **fail-closed**（拿不到基线 / 图就**不判绿**；四条诊断码各 exit 1，人类可读输出为 `[诊断码]` 开头的行）：
        #   impact-baseline-unavailable（HEAD^ 不存在 = 根提交 / 基线无图产物 / 读不出 / JSON 非法）、
        #   impact-current-graph-unavailable（HEAD 版或索引版缺失 / 读不出 / JSON 非法）、
        #   impact-schema-version-mismatch（两边 schema_version 不一致——图与门禁必须同一次提交一起改）、
        #   impact-graph-malformed（顶层非对象 / edges 或 symbol_edges 不是数组）。
        # 另有 exit 2 = 命令行用法错误（未知开关 / `--root` 缺参数）；`--root` 指向非 git 仓库根同样 exit 1 拒绝，不回退。
        # **回归用例**：`npm test` 里的 tests/impact-gate-e2e.mjs（**断言条数是活值 —— 取数、不复述**：
        # 跑它、读末行的 `✔ N/N 条断言通过`；**留痕（时点 = 本批开工版 `4e0170f`；只作留痕、不是现值）**：
        # 该时点写作 9 组 75 条断言；临时夹具用 `git checkout-index`
        # 物化真仓库、图用真生成器重算、跑完自删）——覆盖上面每条判据与四条 fail-closed 诊断码，包括：
        # 删被引用文件（点名边 id）、删导出符号（新增未解析那一半）、删无人引用文件与只改内容两条反例、
        # **棘轮不追溯历史存量**（C1 引入悬空 → C2 无关改动 ⇒ 在 C2 上 exit 0）、`external`/`outside` 符号边不算未解析、
        # `--staged`（HEAD..index）与默认基准（HEAD^..HEAD）的差别、8a–8e 四条诊断码各一。
        # **含「测试的测试」**（变异测试）：把上面「同为 dangling / 同为未解析」这两行还原成修复前的「基线全量边」
        # 写法 ⇒ 用例 1 的场景必须由 exit 1 变成 exit 0，用例随之报红；改回 ⇒ 全绿。不真改坏一次，就无法证明
        # 这条用例抓得住那个漏报 bug（改坏只发生在夹具目录的副本上，真仓库的实现文件一个字都不改）。
        run: npm run check:impact
      - name: Portability guard (no Windows-only path juggling)
        # 教训：tests 里曾用 pathname.replace(/^\//,'') 拼 file URL —— Windows 正常（/F:/…），
        # Linux 上 pathname 以 / 开头、去掉后变成相对路径，被解析成 <cwd>/home/runner/… 而 ERR_MODULE_NOT_FOUND。
        run: |
          if grep -rIn "pathname\.replace" tests/ ; then
            echo "::error::use new URL(rel, import.meta.url).href instead of pathname.replace (POSIX-unsafe)"; exit 1
          fi
          echo "portability guard ok"

      - name: Install Chromium for renderer checks
        run: npx playwright install --with-deps chromium
      - name: Render contracts in a real browser
        run: npm run test:render

      - name: Sanity checks
        run: |
          node --check lib/index.js
          node --check lib/tools.js
          node --check lib/mcp.js
          node -e "const fs=require('fs');const s=fs.readFileSync('skills/normify-gen/SKILL.md','utf8');if(!s.startsWith('---')||!/name:\s*normify-gen/.test(s))throw new Error('SKILL.md frontmatter invalid');const p=require('./package.json');if(p.dsh||p.peerDependencies)throw new Error('DSH host dependency remains');console.log('sanity ok')"
