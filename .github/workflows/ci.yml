name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine + JSON contracts + graph + managed MCP)
        run: npm test
      - name: Library + MCP tool contract
        run: node ci-contract-check.cjs
      - name: Portability guard (no Windows-only path juggling)
        # 教训：tests 里曾用 pathname.replace(/^\//,'') 拼 file URL —— Windows 正常（/F:/…），
        # Linux 上 pathname 以 / 开头、去掉后变成相对路径，被解析成 <cwd>/home/runner/… 而 ERR_MODULE_NOT_FOUND。
        run: |
          if grep -rIn "pathname\.replace" tests/ ; then
            echo "::error::use new URL(rel, import.meta.url).href instead of pathname.replace (POSIX-unsafe)"; exit 1
          fi
          echo "portability guard ok"

      - name: Install Chromium for renderer checks
        run: npx playwright install --with-deps chromium
      - name: Render contracts in a real browser
        run: npm run test:render

      - name: Sanity checks
        run: |
          node --check lib/index.js
          node --check lib/tools.js
          node --check lib/mcp.js
          node -e "const fs=require('fs');const s=fs.readFileSync('skills/normify-gen/SKILL.md','utf8');if(!s.startsWith('---')||!/name:\s*normify-gen/.test(s))throw new Error('SKILL.md frontmatter invalid');const p=require('./package.json');if(p.dsh||p.peerDependencies)throw new Error('DSH host dependency remains');console.log('sanity ok')"
